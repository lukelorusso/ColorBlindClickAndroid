name: Build and publish

on:
  workflow_dispatch:
    inputs:
      CHECKOUT_BRANCH:
        description: 'Git Branch to checkout'
        required: true
        default: 'main'
      TARGET_BRANCH:
        description: 'Git Branch to merge to at the end'
        required: true
        default: 'main'
      INCREMENT_VERSION:
        description: 'Should increment the version number'
        required: true
        default: true
        type: boolean
      MANUAL_VERSION:
        description: 'Use specific version number instead of automatic versioning: WORKS ONLY IF INCREMENT_VERSION IS UNCHECKED'
        required: false
        default: 'X.X.XX'
      PUBLISH_RELEASE:
        description: 'Trigger release build'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  checks: write

env:
  APP_GROUP: com.lukelorusso.colorblindclick
  APP_NAME: lukelorusso-colorblindclick
  APP_LABEL: ColorBlindClick # used to upload APK
  PROJECT_MODULE: presentation # used to upload APK
  TARGET_BRANCH: ${{ github.event.inputs.TARGET_BRANCH != '' && github.event.inputs.TARGET_BRANCH || 'main' }}
  CHECKOUT_BRANCH: ${{ github.event.inputs.CHECKOUT_BRANCH != '' && github.event.inputs.CHECKOUT_BRANCH || 'main' }}
  INCREMENT_VERSION: ${{ github.event.inputs.INCREMENT_VERSION != '' && github.event.inputs.INCREMENT_VERSION || true }}
  MANUAL_VERSION: ${{ github.event.inputs.MANUAL_VERSION != '' && github.event.inputs.MANUAL_VERSION || 'X.X.XX' }}
  PUBLISH_RELEASE: ${{ github.event.inputs.PUBLISH_RELEASE != '' && github.event.inputs.PUBLISH_RELEASE || false }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: release

    outputs:
      output_app_group: ${{ env.APP_GROUP }}
      output_app_name: ${{ env.APP_NAME }}
      output_version: ${{ steps.new-version.outputs.new-value }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: generate-app-token
        with:
          client-id: ${{ secrets.GHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.GHA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Checkout Branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-app-token.outputs.token }}
          ref: ${{ env.CHECKOUT_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      # Android specific: getting SDK version
      - name: Read Android SDK version
        id: read-androidsdk-version
        uses: ./.github/actions/read-version-libs-versions-toml
        with:
          field-name: 'android-compileSdk'

      # Android specific: setting up SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Read version
        id: read-version
        uses: ./.github/actions/read-version-gradle-properties

      - name: Increment version or Use manual version
        id: new-version
        uses: ./.github/actions/new-version
        with:
          current-value: ${{ steps.read-version.outputs.field-value }}
          increment-version: ${{ env.INCREMENT_VERSION }}
          manual-version: ${{ env.MANUAL_VERSION }}

      - name: Update version
        uses: ./.github/actions/write-version-gradle-properties
        with:
          field-value: ${{ steps.new-version.outputs.new-value }}

      - name: Grant execution permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build test -x assembleRelease

      # Create APK Debug
      - name: Build APK debug
        if: success()
        run: ./gradlew assembleDebug

      # Decode signing keystore (release environment secrets)
      - name: Decode release keystore
        if: success() && env.PUBLISH_RELEASE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      # Create APK Release
      - name: Build APK release
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Create AAB Release
      - name: Build AAB release
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Remove decoded keystore regardless of build outcome
      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      # Upload APK Debug (uploaded as-is, single file, direct download link)
      - name: Rename APK debug
        id: rename-apk-debug
        if: success()
        run: |
          SRC=$(find "${{ env.PROJECT_MODULE }}/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' | head -n1)
          DEST="${{ runner.temp }}/${{ env.APP_LABEL }}-${{ steps.new-version.outputs.new-value }}-debug.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.rename-apk-debug.outputs.path }}
          archive: false

      # Upload APK Release (uploaded as-is, single file, direct download link)
      - name: Rename APK release
        id: rename-apk-release
        if: success() && env.PUBLISH_RELEASE == 'true'
        run: |
          SRC=$(find "${{ env.PROJECT_MODULE }}/build/outputs/apk/release" -maxdepth 1 -name '*.apk' | head -n1)
          DEST="${{ runner.temp }}/${{ env.APP_LABEL }}-${{ steps.new-version.outputs.new-value }}-release.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK release
        if: success() && env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.rename-apk-release.outputs.path }}
          archive: false

      # Upload AAB Release (uploaded as-is, single file, direct download link)
      - name: Rename AAB release
        id: rename-aab-release
        if: success() && env.PUBLISH_RELEASE == 'true'
        run: |
          SRC=$(find "${{ env.PROJECT_MODULE }}/build/outputs/bundle/release" -maxdepth 1 -name '*.aab' | head -n1)
          DEST="${{ runner.temp }}/${{ env.APP_LABEL }}-${{ steps.new-version.outputs.new-value }}-release.aab"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload AAB release
        if: success() && env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.rename-aab-release.outputs.path }}
          archive: false

      # Check native libs directory exists and is not empty, so the next step can be skipped otherwise
      - name: Check native libs
        id: check-native-libs
        if: success() && env.PUBLISH_RELEASE == 'true'
        continue-on-error: true
        run: |
          DIR="${{ env.PROJECT_MODULE }}/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
          if [ -d "$DIR" ] && [ -n "$(find "$DIR" -type f -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload native libs
      - name: Upload native libs
        if: success() && env.PUBLISH_RELEASE == 'true' && steps.check-native-libs.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_LABEL }}-${{ steps.new-version.outputs.new-value }}-native-libs.zip
          path: ${{ env.PROJECT_MODULE }}/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
          if-no-files-found: ignore

      - name: Tag new version
        if: success()
        continue-on-error: true
        uses: ./.github/actions/tag-version
        with:
          new-value: ${{ steps.new-version.outputs.new-value }}

      - name: Tag new release version
        id: tag-release-version
        if: success() && env.PUBLISH_RELEASE == 'true'
        uses: ./.github/actions/tag-version
        with:
          new-value: ${{ steps.new-version.outputs.new-value }}
          is-release: true

      - name: Merge Checkout Branch into Target Branch if different
        if: ${{ env.TARGET_BRANCH != env.CHECKOUT_BRANCH }}
        uses: ./.github/actions/branch-merge
        with:
          github-token: ${{ steps.generate-app-token.outputs.token }}
          source-ref: ${{ env.CHECKOUT_BRANCH }}
          target-branch: ${{ env.TARGET_BRANCH }}

      # Create a GitHub Release, named after the release tag, with the 2 APKs (no AAB) attached
      - name: Create GitHub Release
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
        run: |
          TAG="${{ steps.tag-release-version.outputs.tag-name }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Full commit history up to this release: https://github.com/${{ github.repository }}/commits/$TAG" \
            "${{ steps.rename-apk-debug.outputs.path }}" \
            "${{ steps.rename-apk-release.outputs.path }}"
