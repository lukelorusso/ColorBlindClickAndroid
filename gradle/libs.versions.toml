retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
zoomable-image-box = { group = "com.github.lukelorusso", name = "ZoomableImageBox", version.ref = "zoomable-image-box" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-plugin" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "google-firebase-crashlytics-plugin" }

[bundles]
data = [
    "androidx-datastore",
    "androidx-datastore-preferences",
    "androidx-room-runtime",
    "androidx-sqlite",
    "androidx-sqlite-bundled",
    "koin-core",
    "kotlinx-serialization-json",
    "okhttp3",
    "okhttp3-logging-interceptor",
    "retrofit",
    "retrofit-converter-kotlinx-serialization",
    "timber"
]
data-ksp = [
    "androidx-room-compiler"
]
data-test = [
    "junit"
]
domain = [
    "koin-core",
    "kotlinx-serialization-json"
]
presentation = [
    "androidx-activity-compose",
    "androidx-camera-camera2",
    "androidx-camera-core",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
    "androidx-compose-bom",
    "androidx-compose-fundation",
    "androidx-compose-material3",
    "androidx-compose-runtime-livedata",
    "androidx-compose-ui",
    "androidx-compose-ui-android",
    "androidx-compose-ui-tooling",
    "androidx-lifecycle-runtime-compose",
    "coil",
    "google-android-material",
    "google-firebase-analytics",
    "google-firebase-core",
    "google-firebase-crashlytics",
    "koin-android",
    "koin-core",
    "kotlinx-serialization-json",
    "timber",
    "zoomable-image-box"
]
presentation-test = [
    "junit",
    "koin-test",
    "kotlinx-coroutines-test"
]
