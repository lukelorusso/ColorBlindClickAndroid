[versions]
android-gradle-plugin = "9.1.1"
android-compileSdk = "37"
android-minSdk = "23"
androidx-activity-compose = "1.13.0"
androidx-camerax = "1.6.1"
androidx-compose = "1.11.4"
androidx-compose-material3 = "1.3.2"
androidx-compose-bom = '2026.06.01'
androidx-datastore = "1.2.1"
androidx-lifecycle-runtime-compose = "2.11.0"
androidx-room = "2.8.4"
androidx-sqlite = "2.7.0"
coil = "2.7.0"
google-android-material = "1.14.0"
google-firebase-analytics = "23.2.0"
google-firebase-core = "21.1.1"
google-firebase-crashlytics = "20.1.0"
google-firebase-crashlytics-plugin = "3.0.7"
google-services-plugin = "4.5.0"
junit = "4.13.2"
okhttp3 = "5.4.0"
koin = "4.2.2"
kotlin = "2.4.10"
kotlinx-serialization-json = "1.11.0"
ksp = "2.3.10"
retrofit = "3.0.0"
timber = "5.0.1"
zoomable-image-box = "1.1.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camerax" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "androidx-camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "androidx-camerax" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-fundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "androidx-compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidx-compose-material3" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "androidx-compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "androidx-compose" }
androidx-compose-ui-android = { group = "androidx.compose.ui", name = "ui-android", version.ref = "androidx-compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "androidx-compose" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidx-datastore" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle-runtime-compose" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidx-room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidx-room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidx-sqlite" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "google-android-material" }
google-firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "google-firebase-analytics" }
google-firebase-core = { group = "com.google.firebase", name = "firebase-core", version.ref = "google-firebase-core" }
google-firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "google-firebase-crashlytics" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test" }
